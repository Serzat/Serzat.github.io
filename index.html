<!DOCTYPE html> <!-- Tells the browser that this document uses HTML5 -->

<html lang="en"><!-- <html> starts the HTML document.
     lang="en" tells the browser that the page language is English. -->

<head><!-- <head> contains information about the webpage that is not displayed directly on the page -->

    <meta charset="UTF-8"><!-- <meta> provides information (metadata) about the page.
         charset defines the character encoding.
         UTF-8 allows the page to display many different characters correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <!-- viewport is the visible area of the webpage.
         width=device-width makes the page width match the device's screen width.
         initial-scale=1.0 sets the initial zoom level to 100%. -->

    <title>Serzat Karaman</title>
</head> <!-- </head> ends the head section -->
<body> <!-- <body> contains everything that is actually displayed on the webpage -->
    <h1>Hello World</h1>
    <p>Welkom naar mijn Github Pages</p>
</body> <!-- </body> ends the visible content of the webpage -->
</html> <!-- </html> ends the HTML document -->
