<!DOCTYPE html> <!-- Tells the browser that this document uses HTML5 -->

<html lang="en"><!-- <html> starts the HTML document.
     lang="en" tells the browser that the page language is English. -->

<head><!-- <head> contains information about the webpage that is not displayed directly on the page -->

    <meta charset="UTF-8"><!-- <meta> provides information (metadata) about the page.
         charset defines the character encoding.
         UTF-8 allows the page to display many different characters correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <!-- viewport is the visible area of the webpage.
         width=device-width makes the page width match the device's screen width.
         initial-scale=1.0 sets the initial zoom level to 100%. -->

    <title>Serzat Karaman</title>
    
</head>

<body> <!-- Contains all visible content displayed to the user -->

    <!-- ========================================================= -->
    <!-- NEW: <header> represents introductory content or branding -->
    <!-- ========================================================= -->
    <header>
        <h1>Serzat Karaman</h1> <!-- Main website title / brand name -->

        <!-- =================================================================== -->
        <!-- NEW: <nav> defines a block of navigation links connecting the pages -->
        <!-- =================================================================== -->
        <nav aria-label="Main Navigation">
            <!-- <ul> creates an unordered list of navigation items -->
            <ul>
                <!-- <li> is a list item; <a> creates a clickable hyperlink -->
                <li><a href="index.html">Who Am I</a></li>
                <li><a href="projecten.html">Projecten</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>

    <!-- ======================================================================= -->
    <!-- NEW: <main> defines the dominant, unique content of this specific page -->
    <!-- ======================================================================= -->
    <main>
        <!-- ================================================================= -->
        <!-- NEW: <section> groups related thematic content together with a heading -->
        <!-- ================================================================= -->
        <section id="whoami">
            <h2>Who Am I</h2> <!-- Subheading for this section -->
            <p>Welcome to my portfolio website! I am a Software Engineering student building responsive web applications</p>
        </section>

        <!-- ======================================================================= -->
        <!-- OPDRACHT: Semantische HTML Video sectie                                 -->
        <!-- ======================================================================= -->
        <article id="video-opdracht">
            <header>
                <h2>Semantische HTML Opdracht</h2>
            </header>
            
            <p>Hier is de Fireship-video met een fallback-mechanisme:</p>

            <video width="640" height="360" controls>
                <!-- Primaire bron: Fireship video -->
                <source src="fireship-video.mp4" type="video/mp4">
                
                <!-- Fallback bron: Als de eerste faalt, speelt deze af -->
                <source src="fallback-video.mp4" type="video/mp4">
                
                <!-- Fallback tekst voor niet-ondersteunde browsers -->
                Je browser ondersteunt de videotag niet.
            </video>
        </article>

    </main>

    <!-- ======================================================================= -->
    <!-- NEW: <footer> defines the footer containing copyright, contact info, etc.-->
    <!-- ======================================================================= -->
    <footer>
        <p>&copy; 2026 Serzat Karaman. All rights reserved.</p>
    </footer>

</body> <!-- Ends the visible content of the webpage -->

</html> <!-- Ends the HTML document -->
